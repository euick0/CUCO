name: Build & Release APK

on:
  push:
    branches:
      - claude/android-cuckoo-scanner-YBReF
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Run parser unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Rename APK
        run: |
          mkdir -p artifacts
          cp app/build/outputs/apk/debug/app-debug.apk artifacts/cuco-scanner-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: cuco-scanner-debug-apk
          path: artifacts/cuco-scanner-debug.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CUCo Scanner v1.0 (build ${{ github.run_number }})
          body: |
            APK de debug do CUCo Scanner.

            Commit: ${{ github.sha }}
            Branch: ${{ github.ref_name }}

            Instala com:
            ```
            adb install -r cuco-scanner-debug.apk
            ```
            Em telemóveis sem ADB: descarrega o `.apk` directamente para o telefone, abre o ficheiro e permite instalação de fontes desconhecidas se for pedido.
          files: artifacts/cuco-scanner-debug.apk
          draft: false
          prerelease: false
          make_latest: 'true'
